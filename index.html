<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroşmamican - Şeref Kürsüsü</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: #38bdf8;
            font-size: 2.8rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
        }
        .card img {
            width: 100%;
            height: auto;
            object-fit: contain;
            background-color: #1e293b;
        }
        .card-content {
            padding: 20px;
            text-align: center;
        }
        .name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #f43f5e;
            margin-bottom: 8px;
        }
        .title-text {
            font-size: 1rem;
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <header>
        <h1>AROŞMAMİCAN</h1>
        <p class="subtitle">Efsaneler Geçidi ve Şeref Kürsüsü</p>
    </header>

    <!-- Fotoğrafların listeleneceği alan -->
    <div class="gallery" id="galleryContainer">
        <!-- JavaScript burayı otomatik dolduracak -->
    </div>

    <script src="script.js"></script>
<audio id="birthdaySong" autoplay loop>
        <source src="dogumgunu.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.body.addEventListener('click', function() {
            var audio = document.getElementById("birthdaySong");
            audio.play();
        }, { once: true });
    </script>
</body>
</html>
